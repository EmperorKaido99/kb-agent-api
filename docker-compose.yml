services:
  api:
    build:
      context: ./src/KbAgent.Api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Ollama__BackendBaseUrls__0=http://laptop1.local:11434
      - Ollama__BackendBaseUrls__1=http://laptop2.local:11434
      - Qdrant__Host=qdrant
      - ApiKey__Key=${KB_AGENT_API_KEY:-}
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
