services:
  api:
    build:
      context: ./src/KbAgent.Api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Ollama__BackendBaseUrls__0=http://laptop1.local:11434
      - Ollama__BackendBaseUrls__1=http://laptop2.local:11434
      - Qdrant__Host=qdrant
      - ApiUsers__FilePath=/data/api-users/api-users.json
      - KnowledgeFolder__Path=/data/knowledge-base
      - KnowledgeFolder__ScanIntervalMinutes=${KB_SCAN_INTERVAL_MINUTES:-15}
    volumes:
      # Point KB_FOLDER_PATH at your real documents folder, e.g. a OneDrive/Google Drive desktop-sync mount
      # (both are just local paths from here — no cloud API integration needed).
      - ${KB_FOLDER_PATH:-./knowledge-base}:/data/knowledge-base:ro
      # Persists api-users.json (username -> token hash) across container rebuilds.
      # Create a user with: docker compose run --rm api dotnet KbAgent.Api.dll create-user <username>
      - api-users-data:/data/api-users
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  api-users-data:
